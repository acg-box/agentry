# Repository tasks.

[config]
skip_core_tasks = true

# Check
# | task       | type      |
# | ---------- | --------- |
# | check      | composite |
# | check-json | script    |

[tasks.check]
clear = true
workspace = false
dependencies = ["check-json", "fmt-check", "test-automation"]

[tasks.check-json]
workspace = false
script_runner = "@shell"
script = [
	"python3 -m json.tool .agents/plugins/marketplace.json >/dev/null",
	"python3 -m json.tool plugins/gh-settings/.codex-plugin/plugin.json >/dev/null",
	"python3 -m json.tool plugins/acg-release/.codex-plugin/plugin.json >/dev/null",
	"python3 -m json.tool plugins/automation/.codex-plugin/plugin.json >/dev/null",
]

# Format
# | task           | type      |
# | -------------- | --------- |
# | fmt            | composite |
# | fmt-check      | composite |
# | fmt-toml       | command   |
# | fmt-toml-check | command   |

[tasks.fmt]
workspace = false
dependencies = ["fmt-toml"]

[tasks.fmt-check]
workspace = false
dependencies = ["fmt-toml-check"]

[tasks.fmt-toml]
workspace = false
command = "taplo"
args = ["fmt", ".taplo.toml", "Makefile.toml"]

[tasks.fmt-toml-check]
workspace = false
command = "taplo"
args = ["fmt", "--check", ".taplo.toml", "Makefile.toml"]

[tasks.test-automation]
workspace = false
command = "python3"
args = [
	"-m",
	"unittest",
	"discover",
	"-s",
	"dev/plugins/automation/tests",
	"-p",
	"test_*.py",
]
env = { PYTHONDONTWRITEBYTECODE = "1" }
