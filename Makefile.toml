# Repository tasks.

[config]
skip_core_tasks = true

# Check
# | task       | type      |
# | ---------- | --------- |
# | check      | composite |
# | check-json | script    |

[tasks.check]
clear = true
workspace = false
dependencies = ["check-json", "fmt-check"]

[tasks.check-json]
workspace = false
script_runner = "@shell"
script = [
	"python3 -m json.tool .agents/plugins/marketplace.json >/dev/null",
	"python3 -m json.tool plugins/github-repo-governance/.codex-plugin/plugin.json >/dev/null",
	"python3 -m json.tool plugins/quality-gates/.codex-plugin/plugin.json >/dev/null",
]

# Format
# | task           | type      |
# | -------------- | --------- |
# | fmt            | composite |
# | fmt-check      | composite |
# | fmt-toml       | command   |
# | fmt-toml-check | command   |

[tasks.fmt]
workspace = false
dependencies = ["fmt-toml"]

[tasks.fmt-check]
workspace = false
dependencies = ["fmt-toml-check"]

[tasks.fmt-toml]
workspace = false
command = "taplo"
args = ["fmt", ".taplo.toml", "Makefile.toml"]

[tasks.fmt-toml-check]
workspace = false
command = "taplo"
args = ["fmt", "--check", ".taplo.toml", "Makefile.toml"]
